name: Setup environment

runs:
  using: composite
  steps:
    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version-file: .nvmrc
        cache: yarn

    - name: Install Dependencies
      shell: bash
      run: yarn install --frozen-lockfile --prefer-offline
